<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" href="CSS/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div id="navbar-container"></div>
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb-item active text-primary fw-bold" aria-current="page"><a href="Home.html">Home</a>
            </li>
            <li class="breadcrumb-item active text-primary fw-bold" aria-current="page"><a href="Course.html">Course</a>
            </li>
            <li class="breadcrumb-item active text-primary fw-bold text-muted">Register</li>
        </ol>
    </nav>

    <div class="container  ">
        <form id="form1">

            <div class="row">
                <div class="col-md-6 mx-auto mt-5 bg-light   rounded">
                    <div class="h3 text-center text-primary mt-3 ">Register</div>

                    <div class="mb-3 mt-4 ">
                        <label class="form-label">Full Name</label>
                        <input type="text" class="form-control" id="Full Name" placeholder="Full Name" required>
                    </div>
                    <div class="mb-3 mt-4 ">
                        <label class="form-label">Email Address</label>
                        <input type="text" class="form-control" id="Email Address" placeholder="Email Address" required>
                    </div>
                    <div class="mb-3 mt-4 ">
                        <label class="form-label">Phone Number</label>
                        <input type="number" class="form-control" id="Phone Number" placeholder="Phone Number" required>
                    </div>
                    <div class="mb-3 mt-4 ">
                        <label class="form-label">Select Course</label><br>
                        <select name="department" id="department" class="form-control" placeholder="Select Course"
                            required>
                            <option value="ตัวเลือก">ตัวเลือก</option>
                            <option value="เทคโนโลยีสารสนเทศ">เทคโนโลยีสารสนเทศ</option>
                            <option value="บริหารธุรกิจ">บริหารธุรกิจ</option>
                            <option value="บัญชี">บัญชี</option>
                        </select>
                    </div>
                    <div class="text-center mb-4">
                        <input type="submit" id="submit" class="btn btn-primary" value="Submit">
                        <input type="reset" id="reset" class="btn btn-secondary" value="Cencel">
                    </div>
                </div>
            </div>
        </form>
    </div>
    <div id="footer"></div>

</body>
</html>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="JavaScript/Script.js"></script>
